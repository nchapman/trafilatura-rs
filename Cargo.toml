[package]
name = "trafilatura"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Extract readable content, comments, and metadata from web pages"
license = "Apache-2.0"

[lib]
name = "trafilatura"
path = "src/lib.rs"

[[bin]]
name = "trafilatura"
path = "src/bin/trafilatura.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking"] }
ego-tree = "0.10"
html5ever = "0.29"
kuchiki = "0.8"
readable-readability = "0.4"
regex = "1"
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tendril = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-normalization = "0.1"
url = "2"
whatlang = "0.16"

[dev-dependencies]
encoding_rs = "0.8"
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "extraction"
harness = false

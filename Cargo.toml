[package]
name = "trafilatura"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Extract readable content, comments, and metadata from web pages"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/nchapman/trafilatura-rs"
keywords = ["trafilatura", "extraction", "html", "scraping", "content"]
categories = ["parser-implementations", "text-processing", "web-programming"]
exclude = ["test-files/", "benches/", "scripts/", "CLAUDE.md", "PLAN.md"]

[lib]
name = "trafilatura"
path = "src/lib.rs"

[[bin]]
name = "trafilatura"
path = "src/bin/trafilatura.rs"
required-features = ["cli"]

[features]
cli = ["dep:clap", "dep:reqwest", "dep:tracing-subscriber"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"], optional = true }
reqwest = { version = "0.12", features = ["blocking"], optional = true }
ego-tree = "0.10"
html5ever = "0.36"
justext = { version = "0.1", path = "../justext-rs" }
libreadability = { version = "0.1", path = "../readability-rs" }
regex = "1"
scraper = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tendril = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
unicode-normalization = "0.1"
url = "2"
whatlang = "0.18"

[dev-dependencies]
encoding_rs = "0.8"
pretty_assertions = "1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "extraction"
harness = false

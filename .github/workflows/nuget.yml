name: NuGet

on:
  workflow_dispatch:
    inputs:
      retry_tag:
        description: 'Publish the existing NuGet artifact for a release tag (run from main). Leave blank for a normal build.'
        type: string
        required: false
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build-native:
    name: Build ${{ matrix.rid }}
    if: ${{ !inputs.retry_tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            rid: osx-arm64
            lib: libtrafilatura_uniffi.dylib
          - os: macos-latest
            target: x86_64-apple-darwin
            rid: osx-x64
            lib: libtrafilatura_uniffi.dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rid: linux-x64
            lib: libtrafilatura_uniffi.so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            rid: linux-arm64
            lib: libtrafilatura_uniffi.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rid: win-x64
            lib: trafilatura_uniffi.dll
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            rid: win-arm64
            lib: trafilatura_uniffi.dll
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: uniffi/
          key: ${{ matrix.rid }}

      - name: Install cross-compilation tools
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build native library
        run: cargo build --manifest-path uniffi/Cargo.toml --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.rid == 'linux-arm64' && 'aarch64-linux-gnu-gcc' || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: uniffi/target/${{ matrix.target }}/release/${{ matrix.lib }}

  pack:
    name: Pack
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: uniffi/
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0'

      # Download all native libraries from the matrix build
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: nuget/runtimes

      # Rearrange from native-{rid}/{lib} to {rid}/native/{lib}
      - name: Arrange native libraries
        run: |
          cd nuget/runtimes
          for dir in native-*; do
            rid="${dir#native-}"
            mkdir -p "$rid/native"
            mv "$dir"/* "$rid/native/"
            rmdir "$dir"
          done
          echo "Final layout:"
          find . -type f

      # Use the linux-x64 native lib from the matrix build for uniffi-bindgen-cs
      - name: Install uniffi-bindgen-cs
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.10.0+v0.29.4

      - name: Generate C# bindings
        run: |
          uniffi-bindgen-cs --library nuget/runtimes/linux-x64/native/libtrafilatura_uniffi.so \
            --out-dir uniffi/generated/cs --config uniffi/uniffi.toml
          perl -i -pe 's/\bif \(29 != /if (30 != /; s/expected version `29`/expected version `30`/' \
            uniffi/generated/cs/trafilatura.cs

      # Copy bindings and patch visibility (internal → public) for NuGet consumers
      - name: Prepare bindings for NuGet
        run: |
          cp uniffi/generated/cs/trafilatura.cs nuget/Trafilatura.cs
          perl -i -pe '
            s/^internal (static class TrafilaturaMethods)/public $1/;
            s/^internal (record (ExtractResult|Metadata|ExtractionOptions|ExtractionConfig)\b)/public $1/;
            s/^internal (enum (ExtractionFocus|HtmlDateMode)\b)/public $1/;
            s/^internal (class (UniffiException|TrafilaturaException)\b)/public $1/;
            s/\bTrafilaturaMethods\b/Extractor/g;
          ' nuget/Trafilatura.cs
          # Verify the patch worked — expect at least 8 public types
          patched=$(grep -c '^public' nuget/Trafilatura.cs || true)
          if [ "$patched" -lt 8 ]; then
            echo "ERROR: Expected at least 8 public types, got $patched"
            grep -n '^public\|^internal' nuget/Trafilatura.cs
            exit 1
          fi
          echo "Patched $patched types to public"

      # Derive version from git tag, or use 0.0.0-dev for manual builds
      - name: Pack NuGet
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          dotnet pack nuget/Trafilatura.csproj -c Release -o nuget/out -p:Version="$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: nuget/out/*.nupkg

  publish:
    name: Publish to NuGet
    needs: pack
    if: >-
      !cancelled() &&
      ((needs.pack.result == 'success' && startsWith(github.ref, 'refs/tags/v')) ||
       (needs.pack.result == 'skipped' && github.ref == 'refs/heads/main' && inputs.retry_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0'

      - name: Download release package
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_TAG: ${{ inputs.retry_tag }}
        run: |
          tag="${RETRY_TAG:-$GITHUB_REF_NAME}"
          run_id="$GITHUB_RUN_ID"
          if [[ -n "$RETRY_TAG" ]]; then
            # Only accept artifacts built by this workflow on the original release tag push.
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a release tag like v0.6.1'; exit 1; }
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha)
            run_id=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/nuget.yml/runs" \
              -f event=push -f branch="$tag" -f head_sha="$sha" -F per_page=1 --jq '.workflow_runs[0].id // empty')
            [[ -n "$run_id" ]] || { echo "No tag-push run found for $tag at $sha"; exit 1; }
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name nuget-package --dir package
          test -f "package/Trafilatura.${tag#v}.nupkg"
          echo "NUPKG=package/Trafilatura.${tag#v}.nupkg" >> "$GITHUB_ENV"

      - name: Log in to NuGet
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: nchapman

      - name: Push package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "$NUPKG" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
